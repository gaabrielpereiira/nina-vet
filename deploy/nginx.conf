server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Vite uses content hashes for built assets. Missing assets must be 404,
    # not HTML from the SPA fallback.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Direct links and reloads on /chat, /auth/set-password, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
